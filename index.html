<script>
const T=THREE,$=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const coarse=matchMedia('(pointer:coarse)').matches,SH=!coarse,PI=Math.PI;
const R=new T.WebGLRenderer({canvas:$('#c'),antialias:!coarse});
R.setPixelRatio(Math.min(devicePixelRatio,coarse?1.5:2));R.shadowMap.enabled=SH;
const S=new T.Scene(),cam=new T.PerspectiveCamera(60,1,.5,700);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
const amb=new T.AmbientLight(0xffffff,.7),sun=new T.DirectionalLight(0xffffff,.9),sunDir=new T.Vector3(60,100,40);
sun.castShadow=SH;sun.shadow.mapSize.set(1024,1024);const sc=sun.shadow.camera;sc.left=sc.bottom=-70;sc.right=sc.top=70;sc.far=400;
S.add(amb,sun,sun.target);
const M=(c,o)=>new T.MeshLambertMaterial(Object.assign({color:c},o)),BX=(w,h,d)=>new T.BoxGeometry(w,h,d);
const flat=(g,m,x,y,z,ry)=>{const p=new T.Mesh(g,m);p.rotation.x=-PI/2;p.position.set(x,y,z);S.add(p);return p};

/* ===== WORLD ===== */
const gr=flat(new T.PlaneGeometry(900,900),M(0xb9a878),0,0,0);gr.receiveShadow=SH;
const roadM=M(0x2a2b30);
for(let i=-4;i<=4;i++)for(const a of[0,1]){const p=new T.Mesh(new T.PlaneGeometry(14,520),roadM);p.rotation.x=-PI/2;p.rotation.z=a?PI/2:0;p.position.set(a?0:i*60,.05,a?i*60:0);p.receiveShadow=SH;S.add(p)}
const dm=new T.Object3D();
const mk=new T.InstancedMesh(new T.PlaneGeometry(.3,44).rotateX(-PI/2),new T.MeshBasicMaterial({color:0xf0f0f0}),144);mk.frustumCulled=false;
let n=0;for(let i=-4;i<=4;i++)for(let j=-4;j<4;j++)for(const a of[0,1]){dm.position.set(a?j*60+30:i*60,.08,a?i*60:j*60+30);dm.rotation.set(0,a?PI/2:0,0);dm.updateMatrix();mk.setMatrixAt(n++,dm.matrix)}
S.add(mk);
function wtex(lit){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle=lit?'#000':'#fff';x.fillRect(0,0,64,64);
 for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.fillStyle=lit?(Math.random()<.5?'#ffd27a':'#000'):'#3b4a5c';x.fillRect(i*16+3,j*16+4,10,9)}
 const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;return t}
const baseT=wtex(0),litT=wtex(1);
const BM=['#e8d9b5','#d9c59a','#cfae8a','#f1eadb','#c9b59c','#b9c4c9'].map(c=>new T.MeshLambertMaterial({color:c,map:baseT,emissive:0xffffff,emissiveMap:litT,emissiveIntensity:0}));
const solids=[],TP=[];
function shadow(o){if(SH)o.traverse(m=>{if(m.isMesh)m.castShadow=true})}
function bld(x,z,w,d,h,r){const g=BX(w,h,d),uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*Math.max(w,d)/12,uv.getY(i)*h/12);
 const m=new T.Mesh(g,pick(BM));m.position.set(x,h/2,z);S.add(m);shadow(m);solids.push([x-w/2,x+w/2,z-d/2,z+d/2]);
 const a=new T.Mesh(BX(w*.9,.5,1.8),M(pick([0xc0392b,0x2c6bd6,0x1e9e5a,0xe67e22,0x8e44ad])));a.position.set(x,3.4,z+r*(d/2+.9));S.add(a)}
const mesh=(g,m,x,y,z,p)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o};
function madrasa(w){const g=new T.Group(),sand=M(0xd8c08a),blue=M(0x1f7fc4,{emissive:0x0a2a44}),dk=M(0x17487e);
 mesh(BX(w,13,7),sand,0,6.5,0,g);mesh(BX(11,17,2),sand,0,8.5,-4,g);mesh(BX(5,11,.4),dk,0,6.5,-5.1,g);mesh(BX(7,1,.4),blue,0,13,-5.1,g);
 for(const s of[-1,1]){mesh(new T.CylinderGeometry(1.2,1.5,22,14),sand,s*(w/2-1),11,-3.5,g);mesh(new T.SphereGeometry(1.4,10,6,0,PI*2,0,PI/2),blue,s*(w/2-1),22,-3.5,g);
  mesh(new T.CylinderGeometry(3,3.2,2,16),sand,s*w*.28,14,0,g);mesh(new T.SphereGeometry(3.3,16,8,0,PI*2,0,PI/2),blue,s*w*.28,15,0,g)}
 shadow(g);return g}
function registon(cx,cz){flat(new T.PlaneGeometry(44,44),M(0xdccfa8),cx,.1,cz);
 const a=madrasa(30);a.position.set(cx,0,cz+18);S.add(a);solids.push([cx-15,cx+15,cz+14.5,cz+21.5]);
 const b=madrasa(26);b.position.set(cx-18,0,cz);b.rotation.y=-PI/2;S.add(b);solids.push([cx-21.5,cx-14.5,cz-13,cz+13]);
 const c=madrasa(26);c.position.set(cx+18,0,cz);c.rotation.y=PI/2;S.add(c);solids.push([cx+14.5,cx+21.5,cz-13,cz+13]);
 for(const p of[[-10,-14],[10,-14],[-18,-18],[18,-18]])TP.push([cx+p[0],cz+p[1]])}
const SND=M(0xd8c08a),TQ=M(0x19a3b8,{emissive:0x06262c,flatShading:true}),DKB=M(0x17487e),STN=M(0xcfc6b0),LT={};
function label(t,x,y,z,s){if(!LT[t]){const c=document.createElement('canvas');c.width=512;c.height=96;const g=c.getContext('2d');g.fillStyle='rgba(10,30,60,.8)';g.fillRect(0,0,512,96);g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(2,2,508,92);g.fillStyle='#fff';g.font='bold 38px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,256,50);LT[t]=new T.SpriteMaterial({map:new T.CanvasTexture(c),fog:false})}
 const sp=new T.Sprite(LT[t]);sp.position.set(x,y,z);sp.scale.set(s,s*96/512,1);S.add(sp)}
const sb=(x,y,z,w,h,d,m,ns)=>{mesh(BX(w,h,d),m,x,y+h/2,z,S);if(!ns)solids.push([x-w/2,x+w/2,z-d/2,z+d/2])};
const cyl=(x,y,z,r,h,m)=>mesh(new T.CylinderGeometry(r,r*1.1,h,14),m,x,y+h/2,z,S);
const dome=(x,y,z,r,m,sy)=>{const d=mesh(new T.SphereGeometry(r,16,10,0,PI*2,0,PI/2),m,x,y,z,S);d.scale.y=sy||1};
function gur(cx,cz){sb(cx,0,cz,22,3,22,SND);sb(cx,3,cz,12,9,12,SND,1);cyl(cx,12,cz,5.5,6,TQ);dome(cx,18,cz,6.4,TQ,1.3);
 for(const a of[-1,1])for(const b of[-1,1]){cyl(cx+a*10,3,cz+b*10,1,14,SND);dome(cx+a*10,17,cz+b*10,1.2,TQ)}
 label('Gur-Amir maqbarasi',cx,30,cz,24)}
function bibi(cx,cz){sb(cx-20,0,cz,2,7,40,SND);sb(cx+20,0,cz,2,7,40,SND);sb(cx-12,0,cz-20,16,5,2,SND);sb(cx+12,0,cz-20,16,5,2,SND);
 sb(cx,0,cz+18,20,26,5,SND);mesh(BX(8,14,.5),DKB,cx,7,cz+15.4,S);
 for(const s of[-1,1]){cyl(cx+s*11,0,cz+18,1.6,32,SND);dome(cx+s*11,32,cz+18,1.8,TQ)}
 sb(cx,0,cz+8,14,6,10,SND);cyl(cx,6,cz+8,7,5,SND);dome(cx,11,cz+8,8,TQ,1.1);label('Bibixonim masjidi',cx,36,cz+10,24)}
function shah(cx,cz){for(let i=0;i<6;i++)for(const s of[-1,1]){const x=cx+s*8,z=cz-18.75+i*7.5;sb(x,0,z,9,6,6.5,SND);dome(x,6,z,3.1,TQ,1.1);mesh(BX(.4,4,3),DKB,x-s*4.55,2.5,z,S)}
 label('Shohizinda',cx,16,cz,20)}
function ulugh(cx,cz){cyl(cx,0,cz,10,9,SND);solids.push([cx-9,cx+9,cz-9,cz+9]);cyl(cx,9,cz,10,1.2,DKB);dome(cx,10.2,cz,4,TQ);sb(cx,0,cz-12,6,5,4,SND);label('Ulugʻbek rasadxonasi',cx,20,cz,24)}
const SPEC={'-1,0':gur,'1,0':bibi,'0,-1':shah,'-2,-1':ulugh};
/* daryo va BEHRUZ koʻpriklari */
flat(new T.PlaneGeometry(520,46),M(0x2f7fb8,{emissive:0x0a2a40}),0,.03,150);
for(let i=-5;i<4;i++){const a=i<-4?-262:i*60+7,b=i>=3?262:(i+1)*60-7;if(i==-5)solids.push([-262,-247,127,173]);else solids.push([a,i>=3&&0?262:b,127,173])}
solids.push([247,262,127,173]);
for(let i=-4;i<=4;i++){const x=i*60;for(const s of[-1,1]){sb(x+s*6.8,0,150,.6,1.2,46,STN);cyl(x+s*7,0,150,.5,8,STN)}
 sb(x,8,150,14.5,1.3,1,STN,1);label('BEHRUZ KOʻPRIGI',x,11,150,13)}
for(let bx=-4;bx<4;bx++)for(let bz=-4;bz<4;bz++){const cx=bx*60+30,cz=bz*60+30;if(!bx&&!bz){registon(cx,cz);continue}
 const sp0=SPEC[bx+','+bz];if(sp0){sp0(cx,cz);continue}if(bz==2)continue;
 for(const r of[-1,1])for(const c of[-1,1])bld(cx+c*11,cz+r*15,rnd(18,21),13,rnd(9,26),r);
 for(let k=0;k<3;k++)TP.push([cx+rnd(-20,20),cz+rnd(-4,4)])}
const tr=new T.InstancedMesh(new T.CylinderGeometry(.25,.35,2.5),M(0x6b4a2b),TP.length),cr=new T.InstancedMesh(new T.IcosahedronGeometry(2.2,0),M(0x4f7d3a),TP.length);
TP.forEach((p,i)=>{dm.rotation.set(0,0,0);dm.position.set(p[0],1.25,p[1]);dm.updateMatrix();tr.setMatrixAt(i,dm.matrix);dm.position.y=4;dm.updateMatrix();cr.setMatrixAt(i,dm.matrix)});
tr.frustumCulled=cr.frustumCulled=false;S.add(tr,cr);
/* traffic lights */
const mX=new T.MeshBasicMaterial({color:0x00ff55}),mZ=new T.MeshBasicMaterial({color:0xff2020});
const pl=new T.InstancedMesh(new T.CylinderGeometry(.15,.15,6),M(0x333333),162),lX=new T.InstancedMesh(new T.SphereGeometry(.5,8,6),mX,81),lZ=new T.InstancedMesh(new T.SphereGeometry(.5,8,6),mZ,81);
n=0;for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++){dm.rotation.set(0,0,0);
 dm.position.set(i*60-8,3,j*60+8);dm.updateMatrix();pl.setMatrixAt(n*2,dm.matrix);dm.position.y=6.3;dm.updateMatrix();lX.setMatrixAt(n,dm.matrix);
 dm.position.set(i*60+8,3,j*60-8);dm.updateMatrix();pl.setMatrixAt(n*2+1,dm.matrix);dm.position.y=6.3;dm.updateMatrix();lZ.setMatrixAt(n,dm.matrix);n++}
pl.frustumCulled=lX.frustumCulled=lZ.frustumCulled=false;S.add(pl,lX,lZ);
let tl='x';
/* rain */
const rp=new Float32Array(900*6),rd=[];for(let i=0;i<900;i++)rd.push([rnd(-25,25),rnd(-12,18),rnd(-25,25)]);
const rg=new T.BufferGeometry();rg.setAttribute('position',new T.BufferAttribute(rp,3));
const rain=new T.LineSegments(rg,new T.LineBasicMaterial({color:0xaabbcc,transparent:true,opacity:.5}));rain.frustumCulled=false;rain.visible=false;S.add(rain);

/* ===== CARS ===== */
const CARS=[
{n:'Chevrolet Gentra',type:'sedan',L:4.6,W:1.8,max:52,acc:9,hd:1,snd:55},
{n:'Chevrolet Tracker',type:'suv',L:4.3,W:1.82,max:49,acc:8,hd:.9,snd:48},
{n:'Daewoo Damas',type:'van',L:3.5,W:1.5,max:33,acc:5,hd:1.15,snd:72},
{n:'Chevrolet Labo',type:'pickup',L:3.7,W:1.5,max:35,acc:5.5,hd:1.1,snd:68},
{n:'Chevrolet Cobalt',type:'sedan',L:4.5,W:1.75,max:50,acc:8.5,hd:1,snd:58},
{n:'Daewoo Nexia 1',type:'sedan',L:4.2,W:1.65,max:44,acc:7,hd:1.1,snd:63},
{n:'Daewoo Nexia 2',type:'sedan',L:4.3,W:1.68,max:46,acc:7.5,hd:1.08,snd:60},
{n:'Chevrolet Nexia 3',type:'sedan',L:4.4,W:1.72,max:47,acc:8,hd:1.04,snd:57},
{n:'Chevrolet Onix',type:'sedan',L:4.2,W:1.75,max:54,acc:9.5,hd:1.02,snd:50}];
const COL=['#f4f4f4','#151515','#c0392b','#2c6bd6','#9aa3ab','#1e9e5a','#e6b800'];
function buildCar(sp,col,full){
 const g=new T.Group(),bm=M(col),gl=M(0x1c2b3a),dk=M(0x1a1a1a),L=sp.L,W=sp.W,t=sp.type;
 const o={g,doors:[],wheels:[],fronts:[],spots:[],fl:new T.MeshBasicMaterial({color:0x8a8a7a}),tl:new T.MeshBasicMaterial({color:0x440000}),open:0,wheel:null};
 const add=(geo,mat,x,y,z)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);g.add(m);m.castShadow=SH;return m};
 let by,bh,cy,ch,cl,cz,r=.34;
 if(t=='sedan'){by=.62;bh=.75;ch=.62;cl=L*.5;cz=-L*.06}
 else if(t=='suv'){by=.72;bh=.7;ch=.55;cl=L*.55;cz=-L*.12;r=.38}
 else if(t=='van'){by=.85;bh=1.1;ch=.95;cl=L*.84;cz=-L*.04;r=.33}
 else{by=.75;bh=.9;ch=.7;cl=L*.36;cz=L*.22;r=.33}
 cy=by+bh/2+ch/2;const cw=W*.88;
 add(BX(W,bh,L),bm,0,by,0);add(BX(cw,ch,cl),gl,0,cy,cz);add(BX(cw+.03,.07,cl+.03),bm,0,cy+ch/2,cz);
 if(t=='pickup'){for(const s of[-1,1])add(BX(.07,.4,L*.5),bm,s*(W/2-.03),by+bh/2+.2,-L*.24);add(BX(W,.4,.07),bm,0,by+bh/2+.2,-L/2+.03)}
 add(BX(W+.05,.25,.2),dk,0,by-bh/2+.2,L/2);add(BX(W+.05,.25,.2),dk,0,by-bh/2+.2,-L/2);
 const sil=M(0xb8bcc2),gold=new T.MeshBasicMaterial({color:0xd8b43a});
 for(const s of[-1,1])add(BX(.18,.12,.22),dk,s*(W/2+.1),by+bh/2+.08,cz+cl/2);
 add(BX(cw+.04,.03,cl+.02),sil,0,by+bh/2+.01,cz);add(BX(W*.52,.22,.05),dk,0,by-.02,L/2+.03);add(BX(W*.52,.03,.06),sil,0,by+.12,L/2+.035);
 add(BX(.22,.07,.04),gold,0,by+.08,L/2+.07);add(BX(.22,.07,.04),gold,0,by+.15,-L/2-.05);
 if(t=='suv'){
  const ws=add(BX(cw*.97,.03,ch*1.6),gl,0,cy,cz+cl/2+.2);ws.rotation.x=.55;const rw=add(BX(cw*.97,.03,ch*1.4),gl,0,cy,cz-cl/2-.12);rw.rotation.x=-.6;
  for(const s of[-1,1]){add(BX(.05,.05,cl*.9),sil,s*(cw/2-.1),cy+ch/2+.04,cz);add(BX(.1,.2,L*.78),dk,s*(W/2+.01),by-bh/2+.1,0);for(const f of[1,-1])add(BX(.1,.12,.95),dk,s*(W/2+.01),r*2,f*L*.32)}
  add(BX(W*.6,.2,.12),sil,0,by-bh/2+.05,-L/2-.08);add(BX(W*.6,.12,.1),sil,0,by-bh/2+.08,L/2+.06);add(BX(.8,.05,.05),o.tl,0,cy+ch/2-.04,cz-cl/2-.02)}
 for(const s of[-1,1]){add(BX(.38,.17,.06),o.fl,s*W*.32,by+.1,L/2+.02);add(BX(.38,.15,.06),o.tl,s*W*.32,by+.1,-L/2-.02)}
 const geo=new T.CylinderGeometry(r,r,.26,14).rotateZ(PI/2),rg=new T.CylinderGeometry(r*.62,r*.62,.3,10).rotateZ(PI/2),rm=M(0x9aa0a6);
 for(const s of[-1,1])for(const f of[1,-1]){const m=new T.Mesh(geo,dk);m.add(new T.Mesh(rg,rm));m.castShadow=SH;o.wheels.push(m);
  if(f>0){const p=new T.Group();p.position.set(s*(W/2-.05),r,L*.32);p.add(m);g.add(p);o.fronts.push(p)}else{m.position.set(s*(W/2-.05),r,-L*.32);g.add(m)}}
 if(full){for(const s of[1,-1]){const d=new T.Group(),dl=cl*.5;d.position.set(s*(W/2+.03),by+.15,cz+cl/2-.15);
   const m=new T.Mesh(BX(.06,.8,dl),bm);m.position.z=-dl/2;d.add(m);g.add(d);o.doors.push({p:d,s})}
  add(BX(W*.8,.2,.5),dk,0,by+bh/2,L*.2);
  o.wheel=add(new T.TorusGeometry(.17,.025,6,14),dk,.4,by+bh/2+.3,L*.1);o.wheel.rotation.x=-.5;
  for(const s of[-1,1]){const sl=new T.SpotLight(0xfff0d0,0,70,.45,.4,1),tg=new T.Object3D();sl.position.set(s*W*.32,by+.1,L/2);tg.position.set(s*W*.32,0,L/2+20);g.add(sl,tg);sl.target=tg;o.spots.push(sl)}
  o.fp=new T.Vector3(.4,by+bh/2+ch*.6,0)}
 return o}

/* ===== STATE ===== */
const G={ci:0,col:0,mode:'open',w:'day'},P={x:-3.5,z:-14,h:0,v:0,s:0,st:0,fuel:100},inp={gas:0,brake:0,left:0,right:0,hb:0};
let state='menu',paused=false,camMode=0,lightsOn=false,pc,AI=[],MG=[],orbit=0,clock=0,tt,park=0,bay,raceT=0,best=0,cps=[],cpi=0,holdT=0,beam;
function setCar(){if(pc)S.remove(pc.g);pc=buildCar(CARS[G.ci],COL[G.col],true);S.add(pc.g);const s=CARS[G.ci];
 $('#cn').textContent=s.n;$('#cs').textContent=`Maks. ${Math.round(s.max*3.6)} km/soat · Tezlanish ${s.acc} · Boshqaruv ${Math.round(s.hd*100)}% · ${{sedan:'Sedan',suv:'Krossover',van:'Miniven',pickup:'Pikap'}[s.type]}`;place()}
function place(){pc.g.position.set(P.x,0,P.z);pc.g.rotation.y=P.h}
const WX={day:{bg:0x87ceeb,fg:[80,420],a:.75,ac:0xffffff,s:.95,sc:0xffffff,sp:[60,100,40],em:0,L:0},
sunset:{bg:0xff8a4c,fg:[40,300],a:.5,ac:0xffc9a0,s:.8,sc:0xff9a55,sp:[-100,28,60],em:.4,L:1},
night:{bg:0x060a18,fg:[30,230],a:.28,ac:0x7080b0,s:.15,sc:0x8fa0ff,sp:[40,90,-40],em:1,L:1},
rain:{bg:0x808a94,fg:[20,170],a:.55,ac:0xdde4ea,s:.35,sc:0xcfd8e0,sp:[40,90,30],em:.15,L:1,rain:1}};
function setW(k){G.w=k;const w=WX[k];S.background=new T.Color(w.bg);S.fog=new T.Fog(w.bg,w.fg[0],w.fg[1]);amb.intensity=w.a;amb.color.setHex(w.ac);sun.intensity=w.s;sun.color.setHex(w.sc);sunDir.set(...w.sp);
 BM.forEach(m=>m.emissiveIntensity=w.em);rain.visible=!!w.rain;lightsOn=!!w.L;roadM.color.setHex(w.rain?0x1c1e23:0x2a2b30);ui()}
function ui(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode==G.mode));document.querySelectorAll('[data-w]').forEach(b=>b.classList.toggle('on',b.dataset.w==G.w));
 [...$('#cc').children].forEach((b,i)=>b.classList.toggle('on',i==G.col))}
COL.forEach((c,i)=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.onclick=()=>{G.col=i;setCar();ui()};$('#cc').appendChild(b)});
$('#pv').onclick=()=>{G.ci=(G.ci+CARS.length-1)%CARS.length;setCar()};$('#nx').onclick=()=>{G.ci=(G.ci+1)%CARS.length;setCar()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{G.mode=b.dataset.mode;ui()});
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>setW(b.dataset.w));
function toast(m){const e=$('#toast');e.textContent=m;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,2600)}

/* ===== AUDIO ===== */
let AC,eo,eg,ng,ho=[];
function audio(){if(AC){AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();eo=AC.createOscillator();eo.type='sawtooth';const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=500;eg=AC.createGain();eg.gain.value=0;eo.connect(f);f.connect(eg);eg.connect(AC.destination);eo.start();
 const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;s.loop=true;const nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1800;ng=AC.createGain();ng.gain.value=0;s.connect(nf);nf.connect(ng);ng.connect(AC.destination);s.start()}catch(e){AC=null}}
function horn(on){if(!AC)return;if(on&&!ho.length){[420,520].forEach(fr=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=fr;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();ho.push(o)})}else if(!on){ho.forEach(o=>o.stop());ho=[]}}

/* ===== MODES ===== */
function clearMode(){AI.forEach(a=>S.remove(a.m.g));AI=[];MG.forEach(o=>S.remove(o));MG=[];bay=null;beam=null}
function spawnAI(n){let k=0;while(AI.length<n&&k++<500){const ax=Math.random()<.5?'x':'z',dir=Math.random()<.5?1:-1,line=((Math.random()*9|0)-4)*60,pos=rnd(-230,230);
 if(AI.some(a=>a.ax==ax&&a.dir==dir&&a.line==line&&Math.abs(a.pos-pos)<18))continue;
 if(Math.abs(pos)<30&&line==0)continue;
 const m=buildCar(pick(CARS),pick(COL),false);S.add(m.g);AI.push({m,ax,dir,line,pos,u:8+((line/60+4)%3)*2,c:0})}}
function aiStep(a,dt){const g=a.ax=='x'?tl=='x':tl=='z';let want=a.u;
 const nx=a.dir>0?Math.ceil((a.pos+.01)/60)*60:Math.floor((a.pos-.01)/60)*60,dist=(nx-a.pos)*a.dir;
 if(!g&&dist>9&&dist<20)want=0;
 for(const b of AI)if(b!==a&&b.ax==a.ax&&b.dir==a.dir&&b.line==a.line){const d=(b.pos-a.pos)*a.dir;if(d>0&&d<11)want=0}
 a.c+=(want-a.c)*Math.min(1,dt*(want?1.5:4));a.pos+=a.dir*a.c*dt;if(a.pos*a.dir>250)a.pos=-250*a.dir;
 let x,z,h;if(a.ax=='x'){x=a.pos;z=a.line+a.dir*3.5;h=a.dir>0?PI/2:-PI/2}else{x=a.line-a.dir*3.5;z=a.pos;h=a.dir>0?0:PI}
 a.m.g.position.set(x,0,z);a.m.g.rotation.y=h;a.m.wheels.forEach(w=>w.rotation.x+=a.c*dt*3);
 const dx=P.x-x,dz=P.z-z,d=Math.hypot(dx,dz);if(d<3.6&&d>0){const p=3.6-d;P.x+=dx/d*p;P.z+=dz/d*p;P.v*=.85;a.c*=.5}}
function ring(x,z,c){const m=new T.Mesh(new T.CylinderGeometry(5,5,40,20,1,true),new T.MeshBasicMaterial({color:c,transparent:true,opacity:.3,side:T.DoubleSide,fog:false}));m.position.set(x,20,z);S.add(m);MG.push(m);return m}
function newBay(){const k=(Math.random()*7|0)-3,z=k*60+(Math.random()<.5?22:-22+60);bay={x:-5.2,z:k*60+22};
 if(MG[0])S.remove(MG[0]),MG.length=0;
 const f=new T.Mesh(new T.PlaneGeometry(2.8,5.6),new T.MeshBasicMaterial({color:0x2ecc71,transparent:true,opacity:.6}));f.rotation.x=-PI/2;f.position.set(bay.x,.12,bay.z);S.add(f);MG.push(f);beam=ring(bay.x,bay.z,0x2ecc71);holdT=0}
function initRace(){cps=[[120,0],[120,120],[-120,120],[-120,-120],[0,-120],[0,0]];cpi=0;raceT=0;beam=ring(cps[0][0],cps[0][1],0xffc800)}

/* ===== GAME FLOW ===== */
function startGame(){audio();state='play';paused=false;$('#menu').hidden=true;$('#hud').hidden=false;$('#tc').hidden=!coarse;clearMode();
 Object.assign(P,{x:-3.5,z:-14,h:0,v:0,s:0,fuel:100});park=0;
 if(G.mode=='open')spawnAI(8);if(G.mode=='traffic')spawnAI(40);if(G.mode=='parking')newBay();if(G.mode=='race')initRace();
 toast({open:'Samarqand boʻylab erkin haydang!',traffic:'Trafik rejimi — qoidalarga amal qiling',parking:'Yashil joyga mashinani parkovka qiling',race:'Poyga! Oltin nuqtalarga yetib boring'}[G.mode]);
 camMode=0;place()}
function toMenu(){state='menu';paused=false;clearMode();$('#menu').hidden=false;$('#hud').hidden=true;$('#tc').hidden=true;$('#pause').hidden=true;Object.assign(P,{x:-3.5,z:-14,h:0,v:0});place();pc.open=0;horn(0);if(eg)eg.gain.value=0;if(ng)ng.gain.value=0}
function setPause(p){if(state!='play')return;paused=p;$('#pause').hidden=!p;if(p){if(eg)eg.gain.value=0;if(ng)ng.gain.value=0;horn(0)}}
$('#go').onclick=startGame;$('#rs').onclick=()=>setPause(false);$('#mn').onclick=toMenu;
const act={cam:()=>camMode^=1,door:()=>{if(Math.abs(P.v)<3)pc.open^=1},light:()=>lightsOn=!lightsOn,pause:()=>setPause(!paused),refuel:()=>{if(Math.abs(P.v)<2){P.fuel=100;toast('⛽ Bak toʻldirildi')}},
 wx:()=>{const k=Object.keys(WX);setW(k[(k.indexOf(G.w)+1)%4])}};
function key(k,d){if(k in inp)inp[k]=d;else if(k=='horn')horn(d);else if(d&&act[k])act[k]()}
const KM={KeyW:'gas',ArrowUp:'gas',KeyS:'brake',ArrowDown:'brake',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',Space:'hb',KeyH:'horn',KeyC:'cam',KeyF:'door',KeyL:'light',KeyP:'pause',Escape:'pause',KeyT:'wx',KeyR:'refuel'};
addEventListener('keydown',e=>{const k=KM[e.code];if(!k||state!='play')return;e.preventDefault();if(e.repeat)return;key(k,1)});
addEventListener('keyup',e=>{const k=KM[e.code];if(k&&(k in inp||k=='horn'))key(k,0)});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k,dn=e=>{e.preventDefault();if(state=='play')key(k,1)},up=e=>{e.preventDefault();if(k in inp||k=='horn')key(k,0)};
 b.addEventListener('pointerdown',dn);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,up))});

/* ===== SIM ===== */
function sim(dt){const sp=CARS[G.ci];clock+=dt;
 const ph=clock%14;tl=ph<6?'x':(ph>=7&&ph<13?'z':'-');
 const tg=inp.left-inp.right;P.s+=(tg-P.s)*Math.min(1,dt*(tg?6:9));
 let v=P.v;const gas=inp.gas&&P.fuel>0;
 if(gas){if(v<-.3)v+=30*dt;else v+=sp.acc*dt*Math.max(.05,1-Math.max(0,v)/sp.max);P.fuel-=dt*(.25+.6*Math.max(0,v)/sp.max)}
 else if(P.fuel<=0&&inp.gas&&!P.warn){toast('Yonilgʻi tugadi! R — toʻldirish');P.warn=1}
 if(P.fuel>5)P.warn=0;
 if(inp.brake){if(v>.3)v-=30*dt;else if(v>-9)v-=sp.acc*.5*dt}
 if(!gas&&!inp.brake)v-=Math.sign(v)*Math.min(Math.abs(v),(1.2+Math.abs(v)*.06)*dt*2);
 if(inp.hb)v-=Math.sign(v)*Math.min(Math.abs(v),22*dt);
 v-=v*Math.abs(v)*.0012*dt;P.v=v;
 const st=P.s*.6/(1+Math.abs(v)*.05)*sp.hd;P.st=st;
 P.h+=v/2.7*Math.tan(st)*dt*(inp.hb&&Math.abs(v)>8?1.6:1);
 P.x+=Math.sin(P.h)*v*dt;P.z+=Math.cos(P.h)*v*dt;
 for(const s of solids){const cx=Math.max(s[0],Math.min(P.x,s[1])),cz=Math.max(s[2],Math.min(P.z,s[3]));let dx=P.x-cx,dz=P.z-cz,d=Math.hypot(dx,dz);
  if(d<2.1){if(d<1e-4){dx=1;dz=0;d=1}const p=2.1-d;P.x+=dx/d*p;P.z+=dz/d*p;P.v*=Math.max(0,1-4*dt)}}
 P.x=Math.max(-255,Math.min(255,P.x));P.z=Math.max(-255,Math.min(255,P.z));
 AI.forEach(a=>aiStep(a,dt));
 if(AC){const f=Math.abs(P.v)/sp.max,gf=(f*5)%1;eo.frequency.value=sp.snd*(.6+gf*1.1)+(gas?12:0);eg.gain.value=P.fuel>0?.05+.04*(gas?1:0)+f*.02:0;
  ng.gain.value=((inp.hb&&Math.abs(v)>8)||(Math.abs(st)>.3&&Math.abs(v)>20))?.07:0}
 if(G.mode=='parking'&&bay){const dx=P.x-bay.x,dz=P.z-bay.z,a=((P.h%PI)+PI)%PI,ad=Math.min(a,PI-a);
  if(Math.abs(dx)<1&&Math.abs(dz)<1.5&&ad<.22&&Math.abs(P.v)<1.2){holdT+=dt;if(holdT>1.2){park++;toast('Ajoyib! Parkovka bajarildi ✅ ('+park+')');newBay()}}else holdT=0;
  $('#info').textContent=`🅿️ Parking · bajarildi: ${park} · masofa: ${Math.round(Math.hypot(dx,dz))} m`}
 else if(G.mode=='race'){raceT+=dt;const c=cps[cpi],d=Math.hypot(P.x-c[0],P.z-c[1]);
  if(d<10){cpi++;if(cpi>=cps.length){best=best?Math.min(best,raceT):raceT;toast(`🏁 Aylanish: ${raceT.toFixed(1)} s · Eng yaxshi: ${best.toFixed(1)} s`);raceT=0;cpi=0}else toast('Nuqta ✔')}
  const c2=cps[cpi];beam.position.set(c2[0],20,c2[1]);
  $('#info').textContent=`🏁 Racing · nuqta ${cpi+1}/${cps.length} · ${Math.round(Math.hypot(P.x-c2[0],P.z-c2[1]))} m · ${raceT.toFixed(1)} s`}
 else $('#info').textContent=G.mode=='open'?'🌍 Open World · Samarqand':'🚦 Traffic · svetofor qoidalariga amal qiling';
 $('#kmh').textContent=Math.round(Math.abs(P.v)*3.6);$('#fub').style.width=Math.max(0,P.fuel)+'%';$('#fub').style.background=P.fuel<20?'#e74c3c':'#2ecc71'}

/* ===== RENDER ===== */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state=='play'&&!paused)sim(dt);
 const sp=CARS[G.ci];
 place();pc.g.updateMatrixWorld(true);
 const spin=P.v*dt/.35;pc.wheels.forEach(w=>w.rotation.x+=spin);pc.fronts.forEach(f=>f.rotation.y=P.st);
 if(pc.wheel)pc.wheel.rotation.z=-P.s*2.5;
 pc.doors.forEach(d=>{const t=pc.open?-d.s*1.1:0;d.p.rotation.y+=(t-d.p.rotation.y)*Math.min(1,dt*6)});
 const br=state=='play'&&(inp.brake&&P.v>.3||inp.hb);pc.tl.color.setHex(br?0xff2222:lightsOn?0x990000:0x440000);pc.fl.color.setHex(lightsOn?0xffffcc:0x8a8a7a);pc.spots.forEach(s=>s.intensity=lightsOn?2.2:0);
 const gX=tl=='x',gZ=tl=='z';mX.color.setHex(gX?0x00ff55:0xff2020);mZ.color.setHex(gZ?0x00ff55:0xff2020);
 sun.position.set(P.x+sunDir.x,sunDir.y,P.z+sunDir.z);sun.target.position.set(P.x,0,P.z);
 if(rain.visible){rd.forEach((d,i)=>{d[1]-=40*dt;if(d[1]<-12)d[1]+=30;rp.set([d[0],d[1],d[2],d[0],d[1]+.9,d[2]],i*6)});rg.attributes.position.needsUpdate=true;rain.position.copy(cam.position)}
 if(state=='menu'){orbit+=dt*.35;cam.position.set(P.x+Math.sin(orbit)*8.5,3,P.z+Math.cos(orbit)*8.5);cam.lookAt(P.x,1,P.z);cam.fov=60}
 else if(camMode==0){const f=new T.Vector3(Math.sin(P.h),0,Math.cos(P.h)),tp=new T.Vector3(P.x,3.3,P.z).addScaledVector(f,-7.5);cam.position.lerp(tp,Math.min(1,dt*6));cam.lookAt(P.x+f.x*4,1.3,P.z+f.z*4);cam.fov=60+Math.abs(P.v)*.4}
 else{cam.position.copy(pc.g.localToWorld(pc.fp.clone()));cam.lookAt(pc.g.localToWorld(new T.Vector3(.4,pc.fp.y-.05,15)));cam.fov=72}
 cam.updateProjectionMatrix();R.render(S,cam)}
setW('day');setCar();ui();requestAnimationFrame(frame);
</script></body></html>
